server:
  port: 8080

spring:

  application:
    name: budget-ai-api

  profiles:
    default: dev

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2

openai:
  api:

    key: ${OPENAI_API_KEY}

    stt-model: whisper-1
    base-url: https://api.openai.com/v1/audio/transcriptions

    tts:
      model: gpt-4o-mini-tts
      voice: alloy
      base-url: https://api.openai.com/v1/audio/speech

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  initial-admin:
    email: ${INITIAL_ADMIN_EMAIL:}
    password: ${INITIAL_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  http:
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:5s}
    read-timeout: ${OPENAI_READ_TIMEOUT:30s}